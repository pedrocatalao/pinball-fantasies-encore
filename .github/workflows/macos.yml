name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # to attach the package to a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # The release's tag (v1.2.3) when building one, so the game knows which it is; empty otherwise.
  ENCORE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
  SDL_VERSION: 3.4.16

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # The official framework carries both architectures, which Homebrew's SDL does not, so
      # one build runs on Apple Silicon and Intel alike.
      - name: Fetch the SDL3 framework
        run: |
          curl -fsSL -o sdl3.dmg "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.dmg"
          hdiutil attach -nobrowse -quiet sdl3.dmg -mountpoint /tmp/sdl3
          cp -R /tmp/sdl3/SDL3.xcframework/macos-arm64_x86_64/SDL3.framework .
          hdiutil detach -quiet /tmp/sdl3
          lipo -archs SDL3.framework/SDL3

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENCORE_VERSION="${ENCORE_VERSION#v}" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DENCORE_SDL3_FRAMEWORK="$PWD/SDL3.framework" \

      - name: Build
        run: cmake --build build -j3

      # The tests that need the original game files skip themselves when the files are not
      # there, which they never are here: the game's data is not redistributable.
      # The tests that play whole games need the game's table files, which are never in the
      # repository: they are fetched from the server as the score checking does (server/verify.sh),
      # into the runner's own temporary folder, and then required, so that those tests cannot pass
      # by being skipped. Without the token (pull requests from forks) they are skipped instead.
      - name: Fetch the game's table files
        env:
          ENCORE_API: ${{ vars.ENCORE_API }}
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
        run: |
          if [ -z "$VERIFIER_TOKEN" ] || [ -z "$ENCORE_API" ]; then
            echo "no token here: the tests that need the game's files are skipped"
            exit 0
          fi
          dir="$RUNNER_TEMP/game-files"
          mkdir -p "$dir"
          for n in 1 2 3 4; do
            for ext in PRG MOD; do
              curl -fsS --retry 3 -H "Authorization: Bearer $VERIFIER_TOKEN" -o "$dir/TABLE$n.$ext" \
                "$ENCORE_API/v1/verifier/files/TABLE$n.$ext"
            done
          done
          echo "ENCORE_DATA=$dir" >> "$GITHUB_ENV"
          echo "ENCORE_REQUIRE_DATA=1" >> "$GITHUB_ENV"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the application was assembled
        run: |
          app="build/Pinball Fantasies.app/Contents"
          test -x "$app/MacOS/Pinball Fantasies"
          test -f "$app/Resources/icon.icns"
          test -f "$app/Resources/shaders/post.frag"
          test -f "$app/Resources/font.png"
          test -x build/encore-play && test -x build/encore-extract
          lipo -archs "$app/MacOS/Pinball Fantasies" | tee /dev/stderr | grep -q x86_64
          lipo -archs "$app/MacOS/Pinball Fantasies" | grep -q arm64

      # SDL travels inside the application, which was linked to look for it there. Changing
      # anything in a bundle voids its signature, so it is signed again without a certificate.
      - name: Package
        run: |
          app="build/Pinball Fantasies.app"
          mkdir -p "$app/Contents/Frameworks"
          cp -R SDL3.framework "$app/Contents/Frameworks/"
          codesign --force --sign - --deep "$app"
          codesign --verify --deep --strict "$app"
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Pinball Fantasies.app" ../pinball-fantasies-encore-macos-universal.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "pinball-fantasies-encore-macos-universal.zip" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: pinball-fantasies-encore-macos-universal
          path: pinball-fantasies-encore-macos-universal.zip
          if-no-files-found: error
