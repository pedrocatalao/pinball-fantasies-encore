name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # to attach the package to a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # The release's tag (v1.2.3) when building one, so the game knows which it is; empty otherwise.
  ENCORE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
  SDL_VERSION: 3.4.16

jobs:
  build:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the SDL3 development files
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile sdl3.zip
          Expand-Archive sdl3.zip -DestinationPath sdl3

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$pwd/sdl3/SDL3-$env:SDL_VERSION/cmake" -DENCORE_VERSION="$($env:ENCORE_VERSION -replace '^v','')"

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j3

      # The tests that play whole games need the game's table files, which are never in the
      # repository: they are fetched from the server as the score checking does (server/verify.sh),
      # into the runner's own temporary folder, and then required, so that those tests cannot pass
      # by being skipped. Without the token (pull requests from forks) they are skipped instead.
      - name: Fetch the game's table files
        shell: pwsh
        env:
          ENCORE_API: ${{ vars.ENCORE_API }}
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
        run: |
          if (-not $env:VERIFIER_TOKEN -or -not $env:ENCORE_API) {
            Write-Output "no token here: the tests that need the game's files are skipped"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "game-files"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $headers = @{ Authorization = "Bearer $env:VERIFIER_TOKEN" }
          foreach ($n in 1..4) {
            foreach ($ext in "PRG", "MOD") {
              Invoke-WebRequest -Uri "$env:ENCORE_API/v1/verifier/files/TABLE$n.$ext" -Headers $headers `
                -OutFile (Join-Path $dir "TABLE$n.$ext") -MaximumRetryCount 3
            }
          }
          "ENCORE_DATA=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ENCORE_REQUIRE_DATA=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Check what was built
        shell: pwsh
        run: |
          foreach ($f in @(
            "build/RelWithDebInfo/Pinball Fantasies.exe",
            "build/RelWithDebInfo/shaders/post.frag",
            "build/RelWithDebInfo/font.png",
            "build/RelWithDebInfo/encore-play.exe",
            "build/RelWithDebInfo/encore-extract.exe")) {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          # The C++ runtime is built in (CMakeLists.txt): nothing but Windows and SDL3.dll is needed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $needs = & $dumpbin.FullName /dependents "build/RelWithDebInfo/Pinball Fantasies.exe"
          $needs
          if ($needs -match "VCRUNTIME|MSVCP|vcruntime|msvcp") { throw "the game needs Microsoft's C++ runtime installed" }
          # And it reads text as UTF-8 (packaging/windows/utf8.manifest).
          $exe = [System.IO.File]::ReadAllBytes("build/RelWithDebInfo/Pinball Fantasies.exe")
          if (-not ([System.Text.Encoding]::ASCII.GetString($exe) -match "activeCodePage")) { throw "the game has no UTF-8 manifest" }

      # SDL3.dll goes beside the executable, where Windows looks for it first.
      - name: Package
        shell: pwsh
        run: |
          $dist = "pinball-fantasies-encore"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "build/RelWithDebInfo/Pinball Fantasies.exe" $dist
          Copy-Item -Recurse "build/RelWithDebInfo/shaders" $dist
          Copy-Item "build/RelWithDebInfo/font.png" $dist
          Copy-Item "sdl3/SDL3-$env:SDL_VERSION/lib/x64/SDL3.dll" $dist
          Compress-Archive -Path $dist -DestinationPath "pinball-fantasies-encore-windows-x64.zip"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "pinball-fantasies-encore-windows-x64.zip" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: pinball-fantasies-encore-windows-x64
          path: pinball-fantasies-encore-windows-x64.zip
          if-no-files-found: error
