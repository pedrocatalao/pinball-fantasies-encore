name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # to attach the package to a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # The release's tag (v1.2.3) when building one, so the game knows which it is; empty otherwise.
  ENCORE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
  SDL_VERSION: 3.4.16

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    # 22.04 on purpose: a binary asks for a glibc no older than the one it was built
    # against, and glibc only promises the other direction, so building on the oldest
    # runner still supported is what lets the package run on more machines.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - name: Install what SDL3 and OpenGL need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libxinerama-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libibus-1.0-dev

      # Ubuntu has no SDL3 package yet, so it is built once and kept for later runs.
      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ~/sdl3-install
          key: sdl3-${{ env.SDL_VERSION }}-${{ matrix.runner }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" | tar xz
          cmake -S "SDL3-${SDL_VERSION}" -B sdl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3-install" \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build sdl-build -j3
          cmake --install sdl-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$HOME/sdl3-install" -DENCORE_VERSION="${ENCORE_VERSION#v}"

      - name: Build
        run: cmake --build build -j3

      # The tests that play whole games need the game's table files, which are never in the
      # repository: they are fetched from the server as the score checking does (server/verify.sh),
      # into the runner's own temporary folder, and then required, so that those tests cannot pass
      # by being skipped. Without the token (pull requests from forks) they are skipped instead.
      - name: Fetch the game's table files
        env:
          ENCORE_API: ${{ vars.ENCORE_API }}
          VERIFIER_TOKEN: ${{ secrets.VERIFIER_TOKEN }}
        run: |
          if [ -z "$VERIFIER_TOKEN" ] || [ -z "$ENCORE_API" ]; then
            echo "no token here: the tests that need the game's files are skipped"
            exit 0
          fi
          dir="$RUNNER_TEMP/game-files"
          mkdir -p "$dir"
          for n in 1 2 3 4; do
            for ext in PRG MOD; do
              curl -fsS --retry 3 -H "Authorization: Bearer $VERIFIER_TOKEN" -o "$dir/TABLE$n.$ext" \
                "$ENCORE_API/v1/verifier/files/TABLE$n.$ext"
            done
          done
          echo "ENCORE_DATA=$dir" >> "$GITHUB_ENV"
          echo "ENCORE_REQUIRE_DATA=1" >> "$GITHUB_ENV"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check what was built
        run: |
          test -x "build/Pinball Fantasies"
          test -f build/shaders/post.frag
          test -f build/font.png
          test -x build/encore-play && test -x build/encore-extract

      # SDL travels in lib/ beside the binary, which is told to look there first, so the
      # package runs on a machine that has no SDL3 of its own.
      - name: Package
        run: |
          dist="pinball-fantasies-encore"
          mkdir -p "$dist/lib"
          cp "build/Pinball Fantasies" "$dist/"
          cp -r build/shaders build/font.png "$dist/"
          # To put it in the menu, with its icon: optional, and all under ~/.local.
          cp packaging/linux/install.sh assets/app/icon.png "$dist/"
          cp -L "$(ldd "build/Pinball Fantasies" | awk '/libSDL3/ {print $3}')" "$dist/lib/"
          # The build keeps its debugging information inside the files, most of their size;
          # players have no use for it.
          strip "$dist/Pinball Fantasies"
          strip --strip-unneeded "$dist/lib/"libSDL3.so*
          patchelf --set-rpath '$ORIGIN/lib' "$dist/Pinball Fantasies"
          tar czf "pinball-fantasies-encore-linux-${{ matrix.arch }}.tar.gz" "$dist"
          ldd "$dist/Pinball Fantasies" | grep -i sdl

      # The runner has every library this was built against, so it proves nothing about
      # anyone else's machine: the package is unpacked in a bare Debian instead, which has
      # no SDL and an older glibc. Only the graphics library is added, which every machine
      # that can run the game has; anything else the package needs is a fault. --help
      # returns before SDL is started, so no screen is needed -- this asks whether the
      # program can load at all.
      - name: Check the package runs on an older distribution
        run: |
          mkdir -p pkgtest && tar xzf "pinball-fantasies-encore-linux-${{ matrix.arch }}.tar.gz" -C pkgtest
          docker run --rm -v "$PWD/pkgtest:/pkg:ro" -w /pkg/pinball-fantasies-encore \
            debian:bookworm-slim sh -c '
              apt-get -qq update && apt-get -qq install -y --no-install-recommends libgl1 >/dev/null
              ldd "./Pinball Fantasies" && ./"Pinball Fantasies" --help'

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "pinball-fantasies-encore-linux-${{ matrix.arch }}.tar.gz" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: pinball-fantasies-encore-linux-${{ matrix.arch }}
          path: pinball-fantasies-encore-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
