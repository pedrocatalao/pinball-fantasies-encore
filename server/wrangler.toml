# The Worker behind the online high scores (src/index.ts). See README.md for setting it up.
name = "pinball-fantasies-encore"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The project's own address, for the page and the API alike. Cloudflare makes the DNS records
# and the certificate on deploy; the workers.dev address keeps working beside it.
routes = [
  { pattern = "thebestpinball.com", custom_domain = true },
  { pattern = "www.thebestpinball.com", custom_domain = true },
]
# Builds made before the domain still use the workers.dev address.
workers_dev = true

[vars]
# The archive the game offers to fetch on its first start (GET /v1/fantasy). To move it, change
# this and `npx wrangler deploy`: the game asks for it each time, so no release is needed.
FANTASY_URL = "https://files.catbox.moe/d28arv.zip"
# Where the checking job is, for starting it when a game arrives (GITHUB_DISPATCH_TOKEN).
GITHUB_REPO = "pedrocatalao/pinball-fantasies-encore"

[[d1_databases]]
binding = "DB"
database_name = "encore-scores"
# Printed by `npx wrangler d1 create encore-scores`.
database_id = "39690902-9678-465c-a52c-e1dcf9e6e496"
migrations_dir = "migrations"

# The HD pictures and their manifests: `npx wrangler r2 bucket create encore-art`.
[[r2_buckets]]
binding = "ART"
bucket_name = "encore-art"

# The project's page (../site), served as it is; what is not a file there comes to the Worker.
[assets]
directory = "../site"
binding = "ASSETS"
# The videos go through the Worker, which answers for parts of them (src/index.ts, media()).
run_worker_first = ["/media/*"]

# How many games one address may send in a minute (src/index.ts, sendRun), counted by Cloudflare:
# nothing of the address is kept by the Worker. The namespace is any number of this account's own.
[[ratelimits]]
name = "UPLOADS"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Once a day: the recordings of games rejected long ago are deleted (src/index.ts, cleanUp).
[triggers]
crons = ["17 4 * * *"]
